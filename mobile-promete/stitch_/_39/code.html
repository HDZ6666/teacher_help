<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->

                        "secondary-fixed-dim": "#a7cfc2",

                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",

                        "on-tertiary": "#ffffff",
                        "secondary-container": "#c2ebde",
                        "primary-fixed-dim": "#88d6b9",
                        "outline-variant": "#bec9c3",
                        "error-container": "#ffdad6",
                        "primary-container": "#1f7159",
                        "on-tertiary-fixed": "#002114",
                        "on-surface": "#0f1d23",
                        "secondary": "#40655b",
                        "primary": "#005842",
                        "on-secondary-container": "#466c61",
                        "surface-dim": "#cddce4",

                        "tertiary-fixed-dim": "#6fdaac",

                        "tertiary-fixed": "#8cf7c7",
                        "surface-bright": "#f3faff",

                        "on-surface-variant": "#3f4944",
                        "surface-container": "#e1f0f8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                    },
                    "spacing": {
                        "stack_lg": "24px",
                        "gutter": "12px",
                        "page_margin": "14px",
                        "stack_sm": "8px",
                        "stack_md": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Be Vietnam Pro"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-sm": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "display": ["Plus Jakarta Sans"],
                        "body-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"]
                    },

                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],

                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],

                        "display": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

<style>
        /* Smooth scrolling and basic reset */
        html { scroll-behavior: smooth; }
        body { -webkit-tap-highlight-color: transparent; }
        /* Hide scrollbar for clean UI but allow scroll */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Form Element Focus Transitions */
        textarea, input {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col mx-auto max-w-md relative pb-[88px]">
<!-- TopAppBar from JSON -->
<header class="w-full sticky top-0 z-50 bg-surface border-b border-outline-variant flex items-center justify-between px-page_margin h-14 w-full">
<button class="active:scale-95 transition-transform hover:bg-surface-container-high transition-colors p-2 -ml-2 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">错题本</h1>
<button class="active:scale-95 transition-transform hover:bg-surface-container-high transition-colors p-2 -mr-2 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-page_margin py-4 space-y-gutter">
<!-- Context / Header for the task -->
<div class="mb-6">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-1">编辑 AI 解析内容</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">您可以修改以下由系统自动提取和生成的解析内容，以确保其准确无误。</p>
</div>
<!-- Section 1: 题目文本 -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container text-[18px]">format_align_left</span>
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="question-text">题目文本</label>
</div>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-md p-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container resize-none" id="question-text" placeholder="输入题目内容..." rows="3">已知函数 f(x) = ax² + bx + c 经过点 (1, 2) 和 (-1, 0)，且对称轴为 x = 1/2。求函数的解析式。</textarea>
</div>
<!-- Section 2: 答案 -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container text-[18px]">check_circle</span>
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="answer-text">答案</label>
</div>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-md p-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container resize-none" id="answer-text" placeholder="输入最终答案..." rows="2">f(x) = -2x² + 2x + 2</textarea>
</div>
<!-- Section 3: 解题步骤 -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-2">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container text-[18px]">format_list_numbered</span>
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="solution-steps">解题步骤</label>
</div>
<button class="text-primary-container flex items-center gap-1 active:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[16px]">magic_button</span>
<span class="font-label-sm text-label-sm">AI 润色</span>
</button>
</div>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-md p-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container resize-none leading-relaxed" id="solution-steps" placeholder="详细输入解题步骤..." rows="6">1. 由对称轴 x = -b/(2a) = 1/2，得 b = -a。
2. 将点 (1, 2) 代入得：a + b + c = 2。
3. 将点 (-1, 0) 代入得：a - b + c = 0。
4. 联立上述方程组解得：a = -2, b = 2, c = 2。
5. 故函数解析式为 f(x) = -2x² + 2x + 2。</textarea>
</div>
<!-- Section 4: 错因 -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-error text-[18px]">error</span>
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="error-reason">错因分析</label>
</div>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-md p-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container resize-none" id="error-reason" placeholder="记录学生的常见错误原因..." rows="2">学生在代入对称轴公式时符号混淆，导致 b 的值计算错误，进而影响后续方程组的求解。</textarea>
</div>
<!-- Section 5: 知识点 -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container text-[18px]">sell</span>
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">考察知识点</label>
</div>
<!-- Tags Container -->
<div class="flex flex-wrap gap-2">
<div class="inline-flex items-center bg-surface-container-low border border-surface-variant rounded-full px-3 py-1 gap-1">
<span class="font-label-md text-label-md text-primary-container">二次函数图像</span>
<button class="text-outline hover:text-error transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
<div class="inline-flex items-center bg-surface-container-low border border-surface-variant rounded-full px-3 py-1 gap-1">
<span class="font-label-md text-label-md text-primary-container">待定系数法</span>
<button class="text-outline hover:text-error transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
<div class="inline-flex items-center bg-surface-container-low border border-surface-variant rounded-full px-3 py-1 gap-1">
<span class="font-label-md text-label-md text-primary-container">三元一次方程组</span>
<button class="text-outline hover:text-error transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
</div>
<!-- Add Tag Input -->
<div class="relative mt-1">
<input class="w-full bg-surface border border-outline-variant rounded-md py-2.5 pl-3 pr-10 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container" placeholder="添加新知识点..." type="text"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-primary-container flex items-center justify-center p-1 rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
</button>
</div>
</div>
</main>
<!-- Bottom Action Bar (Transactional Logic - Suppresses Global Nav) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-page_margin pb-safe z-50 shadow-[0_-4px_16px_rgba(0,0,0,0.02)]">
<div class="max-w-md mx-auto flex gap-gutter">
<!-- Secondary Button: Discard -->
<button class="flex-1 h-[46px] rounded-lg border border-primary-container text-primary-container bg-transparent font-label-md text-label-md flex items-center justify-center active:scale-[0.98] transition-all">
                放弃修改
            </button>
<!-- Primary Button: Save -->
<button class="flex-1 h-[46px] rounded-lg bg-primary-container text-surface-container-lowest font-label-md text-label-md flex items-center justify-center active:scale-[0.98] transition-all shadow-sm">
                保存修改
            </button>
</div>
</div>
<!-- Safe area padding helper for iOS -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
<script>
        // Simple JS for textarea auto-resize based on content (UX enhancement)
        const textareas = document.querySelectorAll('textarea');
        textareas.forEach(textarea => {
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        });
    </script>
</body></html>
