        body { background-color: #f4f6f5; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      min-height: max(884px, 100dvh);

<body class="bg-[#f4f6f5] text-on-surface antialiased pb-safe flex justify-center w-full min-h-screen">
<div class="w-full max-w-[375px] bg-[#f4f6f5] relative shadow-lg min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface border-b border-outline-variant flat no shadows flex items-center justify-between px-page_margin h-14 transition-colors">
<button aria-label="Back" class="text-primary hover:bg-surface-container-high active:scale-95 transition-transform rounded-full p-2 -ml-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">费用项目</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-page_margin py-stack_md flex flex-col gap-gutter">
<!-- Fee Card 1 -->
<article class="bg-white border border-[#e7ece9] rounded-lg p-[14px] flex flex-col gap-stack_sm">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">建档费</h2>
<div class="font-display text-display text-[#1f7159]">¥200.00</div>
</div>
<div class="flex flex-col gap-2 items-end">
<span class="bg-[#e9f6ef] text-[#227253] font-label-sm text-label-sm px-3 py-1 rounded-full whitespace-nowrap">已启用</span>
<span class="bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-3 py-1 rounded-full whitespace-nowrap">线上售卖</span>
</div>
</div>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="book">book</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">适用课程: 所有课程</span>
</div>
<div class="h-px bg-[#e7ece9] w-full my-1"></div>
<div class="flex justify-end gap-2 mt-1">
<button class="bg-transparent border border-[#1f7159] text-[#1f7159] font-label-md text-label-md px-4 py-2 rounded-lg h-[36px] active:scale-95 transition-transform flex items-center justify-center">编辑</button>
<button class="bg-transparent border border-outline text-outline font-label-md text-label-md px-4 py-2 rounded-lg h-[36px] active:scale-95 transition-transform flex items-center justify-center">停用</button>
<button class="bg-[#1f7159] text-white font-label-md text-label-md px-4 py-2 rounded-lg h-[36px] active:scale-95 transition-transform flex items-center justify-center">详情</button>
</div>
</article>
<!-- Fee Card 2 -->
<article class="bg-white border border-[#e7ece9] rounded-lg p-[14px] flex flex-col gap-stack_sm">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">保险费</h2>
<div class="font-display text-display text-[#1f7159]">¥150.00</div>
</div>
<div class="flex flex-col gap-2 items-end">
<span class="bg-[#e9f6ef] text-[#227253] font-label-sm text-label-sm px-3 py-1 rounded-full whitespace-nowrap">已启用</span>
</div>
</div>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="book">book</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">适用课程: 游泳初级班, 游泳进阶班</span>
</div>
<div class="h-px bg-[#e7ece9] w-full my-1"></div>
<div class="flex justify-end gap-2 mt-1">
<button class="bg-transparent border border-[#1f7159] text-[#1f7159] font-label-md text-label-md px-4 py-2 rounded-lg h-[36px] active:scale-95 transition-transform flex items-center justify-center">编辑</button>
<button class="bg-transparent border border-outline text-outline font-label-md text-label-md px-4 py-2 rounded-lg h-[36px] active:scale-95 transition-transform flex items-center justify-center">停用</button>
<button class="bg-[#1f7159] text-white font-label-md text-label-md px-4 py-2 rounded-lg h-[36px] active:scale-95 transition-transform flex items-center justify-center">详情</button>
</div>
</article>
<!-- Add New Button -->
<button class="mt-4 bg-transparent border-2 border-dashed border-[#1f7159] text-[#1f7159] font-label-md text-label-md h-[56px] rounded-lg active:scale-95 transition-transform flex items-center justify-center gap-2 hover:bg-[#e9f6ef]">
<span class="material-symbols-outlined" data-icon="add">add</span>
                新增费用项目
            </button>
</main>
<!-- BottomNavBar (Suppressed due to linear/task-focused nature of editing fees list with a back button) -->
</div>
