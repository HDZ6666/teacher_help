<style>
        body { background-color: #f4f6f5; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom radio button styles */
        .custom-radio input[type="radio"] {
            display: none;
        }
        .custom-radio .radio-mark {
            width: 20px;
            height: 20px;
            border: 2px solid #bec9c3;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            margin-right: 8px;
            vertical-align: middle;
            transition: all 0.2s ease;
        }
        .custom-radio input[type="radio"]:checked + .radio-mark {
            border-color: #005842;
        }
        .custom-radio input[type="radio"]:checked + .radio-mark::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #005842;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

<body class="antialiased text-on-surface flex flex-col h-screen overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-page_margin h-14 bg-surface border-b border-outline-variant flat no shadows transition-colors duration-200">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-sm text-headline-sm font-bold text-primary flex-1 text-center pr-10">
            报名续费
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto mt-14 mb-[88px] px-page_margin py-stack_md hide-scrollbar">
<form class="space-y-gutter flex flex-col">
<!-- Student Info Card (Contextual) -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px]">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary font-headline-sm text-headline-sm">
                            李
                        </div>
<div>
<h2 class="font-body-lg text-body-lg text-on-surface font-semibold">李明轩</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">ID: 20230891</p>
</div>
</div>
<span class="px-3 py-1 bg-[#e9f6ef] text-[#227253] font-label-md text-label-md rounded-full">在读</span>
</div>
</div>
<!-- Course Selection Area -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-4">
<!-- Select Course -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">选择课程 <span class="text-error">*</span></label>
<button class="w-full h-[44px] px-3 flex justify-between items-center border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-left" type="button">
<span class="font-body-md text-body-md text-on-surface-variant">请点击选择课程</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</div>
<!-- Select Class -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">选择班级 <span class="text-error">*</span></label>
<button class="w-full h-[44px] px-3 flex justify-between items-center border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-left opacity-50 cursor-not-allowed" type="button">
<span class="font-body-md text-body-md text-on-surface-variant">请先选择课程</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</div>
<!-- Course Hours -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">课时数量 <span class="text-error">*</span></label>
<div class="flex items-center border border-outline-variant rounded-lg h-[44px] bg-surface-container-lowest overflow-hidden">
<button class="w-12 h-full flex items-center justify-center bg-surface-container-low hover:bg-surface-variant text-on-surface-variant border-r border-outline-variant transition-colors" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 h-full text-center font-body-md text-body-md border-none focus:ring-0 text-on-surface bg-transparent" type="number" value="10"/>
<button class="w-12 h-full flex items-center justify-center bg-surface-container-low hover:bg-surface-variant text-on-surface-variant border-l border-outline-variant transition-colors" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- Financial Details Area -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-4">
<!-- Amount -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">费用金额 (¥) <span class="text-error">*</span></label>
<input class="w-full h-[44px] px-3 border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="请输入金额" type="number"/>
</div>
<!-- Discount -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">优惠减免 (¥)</label>
<input class="w-full h-[44px] px-3 border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="0.00" type="number"/>
</div>
<!-- Final Amount Preview -->
<div class="flex justify-between items-center py-2 border-t border-outline-variant mt-2">
<span class="font-label-md text-label-md text-on-surface-variant">实收金额</span>
<span class="font-headline-md text-headline-md text-primary font-bold">¥ 0.00</span>
</div>
</div>
<!-- Payment Method Area -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface-variant mb-1">支付方式 <span class="text-error">*</span></label>
<div class="grid grid-cols-2 gap-3">
<label class="custom-radio flex items-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input checked="" name="payment_method" type="radio" value="wechat"/>
<span class="radio-mark"></span>
<span class="flex items-center gap-2 font-body-md text-body-md text-on-surface">
<span class="material-symbols-outlined text-[#07C160]" style="font-variation-settings: 'FILL' 1;">chat</span>
                            微信
                        </span>
</label>
<label class="custom-radio flex items-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input name="payment_method" type="radio" value="alipay"/>
<span class="radio-mark"></span>
<span class="flex items-center gap-2 font-body-md text-body-md text-on-surface">
<span class="material-symbols-outlined text-[#1677FF]" style="font-variation-settings: 'FILL' 1;">payments</span>
                            支付宝
                        </span>
</label>
<label class="custom-radio flex items-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input name="payment_method" type="radio" value="cash"/>
<span class="radio-mark"></span>
<span class="flex items-center gap-2 font-body-md text-body-md text-on-surface">
<span class="material-symbols-outlined text-[#F5A623]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
                            现金
                        </span>
</label>
<label class="custom-radio flex items-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input name="payment_method" type="radio" value="transfer"/>
<span class="radio-mark"></span>
<span class="flex items-center gap-2 font-body-md text-body-md text-on-surface">
<span class="material-symbols-outlined text-[#4A90E2]" style="font-variation-settings: 'FILL' 1;">sync_alt</span>
                            转账
                        </span>
</label>
</div>
</div>
<!-- Notes Area -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">备注信息</label>
<textarea class="w-full p-3 border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" placeholder="请输入备注内容（选填）" rows="3"></textarea>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant px-page_margin py-4 pb-6 flex gap-3 z-50">
<button class="flex-1 h-[44px] bg-transparent border border-primary-container text-primary-container font-body-lg text-body-lg font-semibold rounded-lg flex items-center justify-center hover:bg-surface-container-low transition-colors">
            保存并排课
        </button>
<button class="flex-1 h-[44px] bg-primary-container text-on-primary font-body-lg text-body-lg font-semibold rounded-lg flex items-center justify-center hover:bg-tertiary-container transition-colors shadow-sm">
            保存报名
        </button>
</div>
</body></html>
