<!DOCTYPE html><html lang="zh-CN"><head>

        body {
            background-color: #f4f6f5; /* Level 0 Base from Style Guidance */
            -webkit-tap-highlight-color: transparent;

<body class="bg-background text-on-background min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-40 bg-background dark:bg-background flat no shadows">
<div class="flex items-center justify-between px-page_margin h-[56px]">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-high transition-colors active:scale-95 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-extrabold text-primary dark:text-primary-fixed tracking-tight">课程管理</h1>
<button aria-label="Settings" class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-high transition-colors active:scale-95 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 px-page_margin pb-[100px] pt-stack_sm flex flex-col gap-gutter">
<!-- Search Bar -->
<div class="w-full relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant z-10" style="font-variation-settings: 'FILL' 0;">search</span>
<input class="w-full h-[44px] pl-10 pr-4 bg-surface-container-lowest border border-[#e7ece9] rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm" placeholder="搜索课程..." type="text">
</div>
<!-- Course List -->
<div class="flex flex-col gap-gutter">
<!-- Course Card 1 -->
<div class="bg-surface-container-lowest rounded-lg border border-[#e7ece9] p-[14px] flex flex-col gap-stack_sm active:bg-surface-container-low transition-colors duration-200">
<div class="flex justify-between items-start">
<h2 class="font-headline-sm text-headline-sm text-on-surface">少儿英语进阶</h2>
<span class="bg-[#e9f6ef] text-[#227253] font-label-sm text-label-sm px-3 py-1 rounded-full">已发布</span>
</div>
<div class="grid grid-cols-2 gap-x-4 gap-y-2 mt-1">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">school</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">小学三年级</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">schedule</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">48课时</span>
</div>
</div>
<div class="h-[1px] bg-[#e7ece9] w-full my-1"></div>
<div class="flex justify-end gap-2 mt-1">
<button class="h-[36px] px-4 rounded-lg bg-transparent border border-primary-container text-primary-container font-label-md text-label-md active:bg-primary-container/10 transition-colors">查看</button>
<button class="h-[36px] px-4 rounded-lg bg-transparent border border-primary-container text-primary-container font-label-md text-label-md active:bg-primary-container/10 transition-colors">编辑</button>
<button class="h-[36px] px-4 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md active:bg-primary transition-colors">排课</button>
</div>
</div>
<!-- Course Card 2 -->
<div class="bg-surface-container-lowest rounded-lg border border-[#e7ece9] p-[14px] flex flex-col gap-stack_sm active:bg-surface-container-low transition-colors duration-200">
<div class="flex justify-between items-start">
<h2 class="font-headline-sm text-headline-sm text-on-surface">趣味数学启蒙</h2>
<span class="bg-[#e9f6ef] text-[#227253] font-label-sm text-label-sm px-3 py-1 rounded-full">已发布</span>
</div>
<div class="grid grid-cols-2 gap-x-4 gap-y-2 mt-1">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">school</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">幼儿园大班</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">schedule</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">24课时</span>
</div>
</div>
<div class="h-[1px] bg-[#e7ece9] w-full my-1"></div>
<div class="flex justify-end gap-2 mt-1">
<button class="h-[36px] px-4 rounded-lg bg-transparent border border-primary-container text-primary-container font-label-md text-label-md active:bg-primary-container/10 transition-colors">查看</button>
<button class="h-[36px] px-4 rounded-lg bg-transparent border border-primary-container text-primary-container font-label-md text-label-md active:bg-primary-container/10 transition-colors">编辑</button>
<button class="h-[36px] px-4 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md active:bg-primary transition-colors">排课</button>
</div>
</div>
<!-- Course Card 3 -->
<div class="bg-surface-container-lowest rounded-lg border border-[#e7ece9] p-[14px] flex flex-col gap-stack_sm active:bg-surface-container-low transition-colors duration-200 opacity-75">
<div class="flex justify-between items-start">
<h2 class="font-headline-sm text-headline-sm text-on-surface">初中物理精讲</h2>
<span class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-3 py-1 rounded-full">未发布</span>
</div>
<div class="grid grid-cols-2 gap-x-4 gap-y-2 mt-1">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">school</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">初中二年级</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">schedule</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">60课时</span>
</div>
</div>
<div class="h-[1px] bg-[#e7ece9] w-full my-1"></div>
<div class="flex justify-end gap-2 mt-1">
<button class="h-[36px] px-4 rounded-lg bg-transparent border border-primary-container text-primary-container font-label-md text-label-md active:bg-primary-container/10 transition-colors">查看</button>
<button class="h-[36px] px-4 rounded-lg bg-transparent border border-primary-container text-primary-container font-label-md text-label-md active:bg-primary-container/10 transition-colors">编辑</button>
<button class="h-[36px] px-4 rounded-lg bg-surface-variant text-on-surface-variant font-label-md text-label-md cursor-not-allowed">排课</button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Nav Suppressed based on rules: Task-Focused sub-page (courses list within potentially a settings/admin area) -> No Bottom Nav required for a focused management page. I will omit it as per the Shell Visibility filter). -->
<!-- Re-evaluating: The prompt implies a main top-level destination for "Course Management". Since Bottom Nav has 首页 排课 学生 错题本 我的, "排课" might be active, but this is "Course Management" (editing courses). I will suppress bottom nav to prioritize the canvas, as it's a specific management view. -->


</body></html>
