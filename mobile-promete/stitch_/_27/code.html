<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center">
<!-- Mobile Viewport Container -->
<div class="w-full max-w-[375px] bg-background min-h-screen relative flex flex-col shadow-2xl overflow-hidden">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 border-b border-outline-variant flex items-center justify-between px-page_margin h-14 bg-surface text-primary">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary flex-1 text-center pr-10">Teacher Help</h1>
</header>
<!-- Main Content Scrollable Area -->
<main class="flex-1 overflow-y-auto px-page_margin py-stack_md pb-[100px] flex flex-col gap-stack_md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack_sm">新增物品</h2>
<!-- Item Details Card -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-stack_md flex flex-col gap-stack_md">
<!-- Item Name -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">Item Name</label>
<input class="h-[44px] px-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline" placeholder="Enter item name" type="text"/>
</div>
<!-- Image Upload -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">Image Upload</label>
<div class="h-32 border-2 border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-outline group-hover:text-primary-container text-[32px] transition-colors">add_photo_alternate</span>
<span class="font-body-sm text-body-sm text-outline group-hover:text-primary-container transition-colors">Tap to upload image</span>
</div>
</div>
<!-- Specification -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">Specification</label>
<input class="h-[44px] px-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline" placeholder="e.g. 500ml, Box of 10" type="text"/>
</div>
<!-- Selling Price -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">Selling Price</label>
<div class="relative flex items-center">
<span class="absolute left-3 font-body-md text-on-surface-variant">¥</span>
<input class="h-[44px] pl-8 pr-3 w-full rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Low Stock Alert Level -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">Low Stock Alert Level</label>
<input class="h-[44px] px-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline" placeholder="Alert threshold quantity" type="number"/>
</div>
</div>
<!-- Configuration Card -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-stack_md flex flex-col gap-stack_md">
<!-- Bind Courses -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">Bind Courses</label>
<div class="flex flex-wrap gap-2">
<button class="px-3 py-1.5 rounded-full border border-primary-container text-primary-container font-label-md text-label-md flex items-center gap-1 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[16px]">add</span> Add Course
                        </button>
<div class="px-3 py-1.5 rounded-full bg-surface-container-highest text-on-surface font-label-md text-label-md flex items-center gap-1">
                            Basic Math <span class="material-symbols-outlined text-[16px] cursor-pointer hover:text-error transition-colors">close</span>
</div>
</div>
</div>
<hr class="border-outline-variant w-full"/>
<!-- Enable Status -->
<div class="flex items-center justify-between py-1">
<label class="font-body-md text-body-md text-on-surface font-medium">Enable Status</label>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out border-primary-container right-0 z-10" id="enableToggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary-container cursor-pointer" for="enableToggle"></label>
</div>
</div>
<hr class="border-outline-variant w-full"/>

<div class="flex items-center justify-between py-1">
<label class="font-body-md text-body-md text-on-surface font-medium">Online Selling</label>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out border-outline-variant left-0 z-10" id="onlineToggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer" for="onlineToggle"></label>
</div>
</div>
</div>

<div class="h-4"></div>

<button class="flex-1 h-[44px] rounded-lg border border-primary-container text-primary-container bg-transparent font-label-md text-label-md flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
                保存
            </button>
<button class="flex-1 h-[44px] rounded-lg bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center hover:bg-tertiary-container transition-colors active:scale-95">
                保存并入库
            </button>
</div>
</div>
<script>
        // Simple toggle logic for the custom switches
        document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                if(this.checked) {
                    this.style.left = 'auto';
                    this.style.right = '0';
                    this.style.borderColor = '#1f7159';
                    this.nextElementSibling.style.backgroundColor = '#1f7159';
                } else {
                    this.style.right = 'auto';
                    this.style.left = '0';
                    this.style.borderColor = '#bec9c3'; // outline-variant
                    this.nextElementSibling.style.backgroundColor = '#bec9c3';
                }
            });
            
            // Initialize state
            if(checkbox.checked) {
                checkbox.style.left = 'auto';
                checkbox.style.right = '0';
                checkbox.style.borderColor = '#1f7159';
                checkbox.nextElementSibling.style.backgroundColor = '#1f7159';
            } else {
                checkbox.style.right = 'auto';
                checkbox.style.left = '0';
                checkbox.style.borderColor = '#bec9c3';
                checkbox.nextElementSibling.style.backgroundColor = '#bec9c3';
            }
        });
    </script>
