<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AI 分析中</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#d6e5ed",
                        "surface-container-low": "#e7f6fe",
                        "on-primary-container": "#a4f2d4",
                        "on-secondary-fixed-variant": "#284d44",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#e4f3fb",
                        "secondary-fixed": "#c2ebde",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#00201a",
                        "surface-tint": "#166b53",
                        "secondary-fixed-dim": "#a7cfc2",
                        "on-primary-fixed": "#002117",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#a4f2d4",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#c2ebde",
                        "primary-fixed-dim": "#88d6b9",
                        "outline-variant": "#bec9c3",
                        "error-container": "#ffdad6",
                        "primary-container": "#1f7159",
                        "on-tertiary-fixed": "#002114",
                        "on-surface": "#0f1d23",
                        "secondary": "#40655b",
                        "primary": "#005842",
                        "on-secondary-container": "#466c61",
                        "surface-dim": "#cddce4",
                        "inverse-surface": "#243239",
                        "tertiary-fixed-dim": "#6fdaac",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#8cf7c7",
                        "surface-container-highest": "#d6e5ed",
                        "outline": "#6f7974",
                        "background": "#f3faff",
                        "tertiary-container": "#007351",
                        "on-background": "#0f1d23",
                        "on-tertiary-fixed-variant": "#005138",
                        "on-primary-fixed-variant": "#00513d",
                        "inverse-primary": "#88d6b9",
                        "surface": "#f3faff",
                        "surface-container-high": "#dbebf3",
                        "tertiary-fixed": "#8cf7c7",
                        "surface-bright": "#f3faff",
                        "tertiary": "#00583d",
                        "on-surface-variant": "#3f4944",
                        "surface-container": "#e1f0f8"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack_lg": "24px",
                        "gutter": "12px",
                        "page_margin": "14px",
                        "stack_sm": "8px",
                        "stack_md": "16px"
                    },
                    fontFamily: {
                        "label-sm": ["Be Vietnam Pro", "sans-serif"],
                        "headline-md": ["Plus Jakarta Sans", "sans-serif"],
                        "headline-sm": ["Plus Jakarta Sans", "sans-serif"],
                        "body-sm": ["Be Vietnam Pro", "sans-serif"],
                        "label-md": ["Be Vietnam Pro", "sans-serif"],
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body-md": ["Be Vietnam Pro", "sans-serif"],
                        "body-lg": ["Be Vietnam Pro", "sans-serif"]
                    },
                    fontSize: {
                        "label-sm": ["11px", { lineHeight: "14px", fontWeight: "500" }],
                        "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-sm": ["17px", { lineHeight: "24px", fontWeight: "600" }],
                        "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
                        "display": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }]
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(200%)' },
                        }
                    },
                    animation: {
                        scan: 'scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite',
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<!-- Suppressed Shared Components: TopAppBar and BottomNavBar are hidden as this is a linear/transactional loading screen -->
<main class="flex-1 flex flex-col items-center w-full max-w-[375px] mx-auto px-page_margin py-8">
<!-- Spacer for vertical centering -->
<div class="flex-1"></div>
<!-- Thumbnail Container -->
<div class="relative w-[280px] h-[160px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden mb-stack_lg flex items-center justify-center p-4">
<!-- Simulated scanned content -->
<div class="w-full h-full opacity-20 flex flex-col gap-3 pointer-events-none">
<div class="h-3 bg-outline rounded w-1/3"></div>
<div class="h-3 bg-outline rounded w-full"></div>
<div class="h-3 bg-outline rounded w-5/6"></div>
<div class="flex-1 mt-2 border-2 border-dashed border-outline rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-3xl">functions</span>
</div>
</div>
<!-- Scanning Effect Overlay -->
<div class="absolute inset-0 w-full h-[40%] bg-gradient-to-b from-transparent via-primary-fixed/30 to-transparent animate-scan pointer-events-none"></div>
<!-- Center Icon -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-16 h-16 bg-surface-container-lowest/80 backdrop-blur-sm rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl animate-pulse" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
</div>
</div>
<!-- Vertical Progress Tracker -->
<div class="w-full max-w-[240px] flex flex-col mb-stack_lg ml-[20%]">
<!-- Step 1: Completed -->
<div class="flex items-start">
<div class="flex flex-col items-center mr-4">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shrink-0 z-10">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'wght' 600;">check</span>
</div>
<div class="w-[2px] h-8 bg-primary my-1"></div>
</div>
<div class="pt-0.5">
<p class="font-headline-sm text-headline-sm text-on-surface">正在识别题目</p>
</div>
</div>
<!-- Step 2: In Progress -->
<div class="flex items-start">
<div class="flex flex-col items-center mr-4">
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center bg-surface shrink-0 z-10">
<div class="w-2 h-2 rounded-full bg-primary animate-ping"></div>
</div>
<div class="w-[2px] h-8 bg-outline-variant my-1"></div>
</div>
<div class="pt-0.5">
<p class="font-headline-sm text-headline-sm text-primary">正在分析解法</p>
</div>
</div>
<!-- Step 3: Waiting -->
<div class="flex items-start">
<div class="flex flex-col items-center mr-4">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-surface shrink-0 z-10">
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
</div>
<!-- No line for the last item -->
</div>
<div class="pt-0.5">
<p class="font-headline-sm text-headline-sm text-outline">正在生成讲解</p>
</div>
</div>
</div>
<!-- Descriptive Text -->
<p class="font-body-md text-body-md text-on-surface-variant text-center px-4 mb-stack_lg">
            正在为您生成深度解析，您可以先处理其他事务，完成后将收到提醒。
        </p>
<!-- Spacer for vertical centering -->
<div class="flex-1"></div>
<!-- Bottom Action Buttons -->
<div class="w-full flex flex-col gap-3 pb-8">
<button class="w-full h-[44px] bg-primary-container text-white font-label-md text-label-md rounded-lg flex items-center justify-center active:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">
                后台处理
            </button>
<button class="w-full h-[44px] bg-transparent border border-primary-container text-primary-container font-label-md text-label-md rounded-lg flex items-center justify-center active:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">
                取消分析
            </button>
</div>
</main>
</body></html>
