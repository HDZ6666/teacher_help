<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>班级管理</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#002117",
                        "tertiary": "#00583d",
                        "surface-tint": "#166b53",
                        "primary-fixed-dim": "#88d6b9",
                        "surface-dim": "#cddce4",
                        "on-tertiary-container": "#8cf7c7",
                        "surface-container": "#e1f0f8",
                        "secondary-fixed": "#c2ebde",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#6fdaac",
                        "secondary-fixed-dim": "#a7cfc2",
                        "primary": "#005842",
                        "on-secondary-fixed": "#00201a",
                        "on-tertiary-fixed-variant": "#005138",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#c2ebde",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#007351",
                        "surface-container-low": "#e7f6fe",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#a4f2d4",
                        "background": "#f3faff",
                        "outline": "#6f7974",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#002114",
                        "on-surface": "#0f1d23",
                        "inverse-surface": "#243239",
                        "primary-container": "#1f7159",
                        "tertiary-fixed": "#8cf7c7",
                        "on-secondary-fixed-variant": "#284d44",
                        "on-primary-fixed-variant": "#00513d",
                        "inverse-primary": "#88d6b9",
                        "surface-container-high": "#dbebf3",
                        "on-surface-variant": "#3f4944",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#d6e5ed",
                        "on-secondary-container": "#466c61",
                        "secondary": "#40655b",
                        "inverse-on-surface": "#e4f3fb",
                        "error": "#ba1a1a",
                        "surface-bright": "#f3faff",
                        "on-primary-container": "#a4f2d4",
                        "on-background": "#0f1d23",
                        "surface-variant": "#d6e5ed",
                        "surface": "#f3faff",
                        "outline-variant": "#bec9c3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack_lg": "24px",
                        "stack_sm": "8px",
                        "gutter": "12px",
                        "page_margin": "14px",
                        "stack_md": "16px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "display": ["Plus Jakarta Sans"],
                        "body-sm": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "display": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f4f6f5] text-on-surface font-body-md min-h-screen flex flex-col pb-[80px]">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-40 bg-surface-container-lowest border-b border-[#e7ece9]">
<div class="flex items-center justify-between px-page_margin h-[56px]">
<button class="hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">班级管理</h1>
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-page_margin pt-stack_md flex flex-col gap-gutter">
<!-- Search and Filter Bar -->
<div class="flex gap-gutter mb-stack_sm">
<div class="flex-1 relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">search</span>
<input class="w-full h-[44px] pl-10 pr-4 bg-surface-container-lowest border border-[#e7ece9] rounded-lg font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="搜索班级或老师" type="text">
</div>
<button class="h-[44px] px-4 bg-surface-container-lowest border border-[#e7ece9] rounded-lg text-on-surface-variant flex items-center gap-2 font-label-md text-label-md active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">filter_list</span>
                筛选
            </button>
</div>
<!-- Class Card 1 -->
<div class="bg-surface-container-lowest border border-[#e7ece9] rounded-lg p-[14px] flex flex-col gap-stack_sm">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">英语周六A班</h2>
<span class="font-body-sm text-body-sm text-on-surface-variant">剑桥少儿英语Level 2</span>
</div>
<div class="bg-[#e9f6ef] text-[#227253] px-3 py-1 rounded-full font-label-sm text-label-sm whitespace-nowrap">
                    进行中
                </div>
</div>
<div class="grid grid-cols-2 gap-gutter py-2 border-t border-[#e7ece9] mt-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">person</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">王老师</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">group</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">在读 12 人</span>
</div>
<div class="flex items-center gap-2 col-span-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">calendar_today</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">本周有 2 次课</span>
</div>
</div>
<div class="flex gap-2 mt-2">
<button class="flex-1 h-[36px] bg-surface-container-lowest border border-primary text-primary rounded-lg font-label-md text-label-md active:scale-95 transition-transform">查看学员</button>
<button class="flex-1 h-[36px] bg-surface-container-lowest border border-primary text-primary rounded-lg font-label-md text-label-md active:scale-95 transition-transform">排课</button>
<button class="flex-1 h-[36px] bg-primary text-on-primary rounded-lg font-label-md text-label-md active:scale-95 transition-transform">点名</button>
</div>
</div>
<!-- Class Card 2 -->
<div class="bg-surface-container-lowest border border-[#e7ece9] rounded-lg p-[14px] flex flex-col gap-stack_sm">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">自然拼读进阶班</h2>
<span class="font-body-sm text-body-sm text-on-surface-variant">自然拼读全系列</span>
</div>
<div class="bg-[#e9f6ef] text-[#227253] px-3 py-1 rounded-full font-label-sm text-label-sm whitespace-nowrap">
                    进行中
                </div>
</div>
<div class="grid grid-cols-2 gap-gutter py-2 border-t border-[#e7ece9] mt-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">person</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">李老师</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">group</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">在读 8 人</span>
</div>
<div class="flex items-center gap-2 col-span-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">calendar_today</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">本周有 1 次课</span>
</div>
</div>
<div class="flex gap-2 mt-2">
<button class="flex-1 h-[36px] bg-surface-container-lowest border border-primary text-primary rounded-lg font-label-md text-label-md active:scale-95 transition-transform">查看学员</button>
<button class="flex-1 h-[36px] bg-surface-container-lowest border border-primary text-primary rounded-lg font-label-md text-label-md active:scale-95 transition-transform">排课</button>
<button class="flex-1 h-[36px] bg-primary text-on-primary rounded-lg font-label-md text-label-md active:scale-95 transition-transform">点名</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-[80px] bg-surface-container-lowest border-t border-outline-variant hidden md:hidden">
<div class="flex justify-around items-center px-4 h-full">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-secondary-container/50 active:scale-90 transition-transform duration-200 w-16 h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">today</span>
<span class="font-label-md text-label-md mt-1">首页</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-secondary-container/50 active:scale-90 transition-transform duration-200 w-16 h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
<span class="font-label-md text-label-md mt-1">排课</span>
</button>
<button class="flex flex-col items-center justify-center text-primary hover:bg-secondary-container/50 active:scale-90 transition-transform duration-200 w-16 h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-md text-label-md mt-1">学生</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-secondary-container/50 active:scale-90 transition-transform duration-200 w-16 h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">auto_stories</span>
<span class="font-label-md text-label-md mt-1">错题本</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-secondary-container/50 active:scale-90 transition-transform duration-200 w-16 h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-md text-label-md mt-1">我的</span>
</button>
</div>
</nav>


</body></html>
