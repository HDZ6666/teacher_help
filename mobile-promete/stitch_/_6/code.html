<header class="fixed top-0 w-full z-50 border-b border-outline-variant flex justify-between items-center px-page_margin h-14 bg-surface max-w-[375px]">
<div class="flex items-center gap-2">

</div>
<button class="font-label-sm text-label-sm text-primary flex items-center gap-1 hover:bg-surface-container-low transition-colors duration-200 px-2 py-1 rounded">

</button>
</header>

<main class="flex-1 pt-14 pb-8 px-page_margin flex flex-col gap-gutter overflow-y-auto mt-4">
<div class="flex items-center justify-between mb-2">
<h2 class="font-headline-md text-headline-md text-on-surface">特惠套餐</h2>
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">filter_list</span>
</div>
<!-- Collapsed Card (Example 1) -->
<article class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-stack_sm cursor-pointer hover:bg-surface-container-low transition-colors duration-200">
<div class="flex justify-between items-start">
<h3 class="font-headline-sm text-headline-sm text-on-surface">思维+编程启蒙包</h3>
<span class="bg-surface-container-high text-on-surface-variant px-3 py-1 rounded-full font-label-sm text-label-sm">已售罄</span>
</div>
<div class="text-on-surface-variant font-headline-md text-headline-md font-bold mt-1">￥3200</div>
<div class="flex gap-4 text-on-surface-variant font-body-sm text-body-sm mt-1">
<div class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">library_books</span> 课程 2 门</div>
<div class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">category</span> 物品 0 个</div>
</div>
</article>
<!-- Expanded Card (Detail View Example) -->
<article class="bg-surface-container-lowest rounded-lg border border-outline-variant p-[14px] flex flex-col gap-stack_md border-primary relative overflow-hidden">

<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<div class="flex justify-between items-start pl-2">

<span class="bg-secondary-fixed text-on-secondary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm font-semibold">可售</span>
</div>
<div class="pl-2">
<div class="text-primary font-display text-display font-bold">￥4800</div>
</div>
<hr class="border-outline-variant border-t ml-2"/>

<div class="flex flex-col gap-stack_sm pl-2">
<div class="text-on-surface-variant font-label-md text-label-md flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">school</span> 包含课程 (2)
                </div>
<div class="flex gap-2 flex-wrap">
<span class="bg-surface-container px-3 py-1.5 rounded text-on-surface font-body-sm text-body-sm border border-outline-variant/50">少儿英语</span>
<span class="bg-surface-container px-3 py-1.5 rounded text-on-surface font-body-sm text-body-sm border border-outline-variant/50">创意美术</span>
</div>
</div>
<div class="flex flex-col gap-stack_sm pl-2 mt-2">
<div class="text-on-surface-variant font-label-md text-label-md flex items-center gap-1">

<span class="bg-surface-container px-3 py-1.5 rounded text-on-surface font-body-sm text-body-sm border border-outline-variant/50">建档费</span>

</div>

<span class="text-primary font-bold">￥4800</span>
