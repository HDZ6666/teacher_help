<body class="bg-[#f4f6f5] text-on-surface font-body-md min-h-screen">
<!-- TopAppBar (Customized for Sub-page context, no global shell) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-page_margin h-14 bg-surface border-b border-outline-variant">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">课程</h1>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-primary">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</header>
<!-- Main Canvas -->

<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full h-[44px] pl-10 pr-4 bg-surface-container-lowest border border-[#e7ece9] rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-on-surface placeholder:text-on-surface-variant/60" placeholder="搜索课程名称" type="text">
</div>
<!-- Filter Tags -->
<div class="flex overflow-x-auto pb-2 -mx-page_margin px-page_margin space-x-2 scrollbar-hide">
<button class="px-3 py-1 rounded-full bg-primary text-on-primary font-label-md whitespace-nowrap shrink-0 transition-colors">全部</button>
<button class="px-3 py-1 rounded-full bg-surface-container-lowest border border-[#e7ece9] text-on-surface-variant font-label-md whitespace-nowrap shrink-0 hover:bg-surface-container-low transition-colors">一对多</button>
<button class="px-3 py-1 rounded-full bg-surface-container-lowest border border-[#e7ece9] text-on-surface-variant font-label-md whitespace-nowrap shrink-0 hover:bg-surface-container-low transition-colors">一对一</button>
<button class="px-3 py-1 rounded-full bg-surface-container-lowest border border-[#e7ece9] text-on-surface-variant font-label-md whitespace-nowrap shrink-0 hover:bg-surface-container-low transition-colors">启用</button>
<button class="px-3 py-1 rounded-full bg-surface-container-lowest border border-[#e7ece9] text-on-surface-variant font-label-md whitespace-nowrap shrink-0 hover:bg-surface-container-low transition-colors">停用</button>

</div>
</div>

</div>

<button class="font-label-md text-on-surface-variant hover:text-primary transition-colors">编辑</button>

<button class="font-label-md text-on-surface-variant hover:text-primary transition-colors">编辑</button>
