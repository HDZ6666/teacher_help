<body class="font-body-md text-on-background min-h-screen flex flex-col pt-4 pb-24">

<header class="px-page_margin pb-4 flex items-center gap-4">

</button>

<!-- Context Alert -->
<div class="bg-warning-bg border border-warning-text/20 rounded-lg p-4 flex gap-3 items-start">
<span class="material-symbols-outlined text-warning-text mt-0.5">warning</span>
<div class="flex-1">
<p class="font-headline-sm text-headline-sm text-warning-text mb-1">发现 2 个排课冲突</p>
<p class="font-body-sm text-body-sm text-warning-text/80">请处理以下冲突以完成排课。您也可以选择跳过这些有冲突的课次。</p>
</div>
</div>
<!-- Conflict Item 1: Teacher Conflict -->
<div class="bg-surface-container-lowest border border-[#e7ece9] rounded-lg overflow-hidden shadow-sm">
<div class="p-4 border-b border-[#e7ece9] bg-surface/30">
<div class="flex items-center gap-2 mb-2">
<span class="inline-flex items-center gap-1 bg-[#fff5d8] text-[#8a671b] px-2 py-0.5 rounded-full font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[14px]">person_off</span>
                        老师冲突
                    </span>
<span class="font-label-md text-label-md text-on-surface-variant">第 3 节课次</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-background">王老师在 14:00 已有课程</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">原计划：2023-10-25 14:00 - 15:30 · 高一数学强化班</p>
</div>
<div class="p-4 bg-surface-container-lowest flex gap-3">
<button class="flex-1 h-[44px] rounded-lg border border-primary-container text-primary-container font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px]">swap_horiz</span>
                    更换老师
                </button>
<button class="flex-1 h-[44px] rounded-lg border border-primary-container text-primary-container font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px]">schedule</span>
                    修改时间
                </button>
</div>
</div>
<!-- Conflict Item 2: Room Conflict -->
<div class="bg-surface-container-lowest border border-[#e7ece9] rounded-lg overflow-hidden shadow-sm">
<div class="p-4 border-b border-[#e7ece9] bg-surface/30">
<div class="flex items-center gap-2 mb-2">
<span class="inline-flex items-center gap-1 bg-[#fff5d8] text-[#8a671b] px-2 py-0.5 rounded-full font-label-sm text-label-sm">
