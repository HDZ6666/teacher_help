<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>规则排课</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#002114",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#466c61",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#00513d",
                        "surface-container-highest": "#d6e5ed",
                        "tertiary-fixed-dim": "#6fdaac",
                        "surface-variant": "#d6e5ed",
                        "surface-tint": "#166b53",
                        "inverse-surface": "#243239",
                        "tertiary-container": "#007351",
                        "surface-container": "#e1f0f8",
                        "on-error": "#ffffff",
                        "surface": "#f3faff",
                        "secondary-fixed": "#c2ebde",
                        "primary": "#005842",
                        "surface-container-low": "#e7f6fe",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#a7cfc2",
                        "primary-container": "#1f7159",
                        "on-tertiary-fixed-variant": "#005138",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#88d6b9",
                        "secondary": "#40655b",
                        "on-secondary-fixed-variant": "#284d44",
                        "outline": "#6f7974",
                        "on-primary": "#ffffff",
                        "background": "#f3faff",
                        "on-primary-fixed": "#002117",
                        "on-background": "#0f1d23",
                        "secondary-container": "#c2ebde",
                        "on-surface-variant": "#3f4944",
                        "on-surface": "#0f1d23",
                        "on-tertiary-container": "#8cf7c7",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#a4f2d4",
                        "surface-bright": "#f3faff",
                        "on-primary-container": "#a4f2d4",
                        "surface-container-high": "#dbebf3",
                        "tertiary": "#00583d",
                        "primary-fixed-dim": "#88d6b9",
                        "on-secondary-fixed": "#00201a",
                        "inverse-on-surface": "#e4f3fb",
                        "tertiary-fixed": "#8cf7c7",
                        "outline-variant": "#bec9c3",
                        "surface-dim": "#cddce4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "stack_lg": "24px",
                        "stack_md": "16px",
                        "stack_sm": "8px",
                        "page_margin": "14px"
                    },
                    "fontFamily": {
                        "display": ["Plus Jakarta Sans"],
                        "body-md": ["Be Vietnam Pro"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-sm": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "display": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #bec9c3;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col items-center">
<!-- Mobile Container -->
<div class="w-full max-w-[375px] min-h-screen bg-surface-bright relative flex flex-col shadow-xl overflow-hidden">
<!-- TopAppBar (Transactional - Hidden global nav, custom back button) -->
<header class="fixed top-0 w-full max-w-[375px] z-50 bg-surface border-b border-outline-variant flex items-center justify-between px-page_margin h-14 transition-colors duration-200">
<button aria-label="返回" class="text-on-surface-variant hover:bg-surface-container-low rounded-full p-2 -ml-2 active:opacity-80 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">规则排课</h1>
<div class="w-[40px]"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 mt-14 mb-[88px] overflow-y-auto px-page_margin py-stack_md space-y-stack_lg">
<!-- Step 1: Schedule Rule -->
<section class="bg-surface-container-lowest rounded-lg border border-outline-variant p-stack_md">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack_sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">event_repeat</span>
                    重复规则
                </h2>
<div class="grid grid-cols-4 gap-2 mt-stack_sm">
<button class="py-2 px-1 rounded border border-outline-variant text-center font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">每天</button>
<button class="py-2 px-1 rounded border border-outline-variant text-center font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">隔天</button>
<button class="py-2 px-1 rounded border-2 border-primary bg-surface-container-low text-center font-label-md text-label-md text-primary font-bold">每周</button>
<button class="py-2 px-1 rounded border border-outline-variant text-center font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">隔周</button>
</div>
</section>
<!-- Step 2: Select Days -->
<section class="bg-surface-container-lowest rounded-lg border border-outline-variant p-stack_md">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack_sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">calendar_month</span>
                    上课星期
                </h2>
<div class="flex justify-between mt-stack_sm">
<button class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant">一</button>
<button class="w-10 h-10 rounded-full border border-primary bg-primary-container text-on-primary flex items-center justify-center font-label-md text-label-md">二</button>
<button class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant">三</button>
<button class="w-10 h-10 rounded-full border border-primary bg-primary-container text-on-primary flex items-center justify-center font-label-md text-label-md">四</button>
<button class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant">五</button>
<button class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant">六</button>
<button class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant">日</button>
</div>
</section>
<!-- Step 3: Time Slots -->
<section class="bg-surface-container-lowest rounded-lg border border-outline-variant p-stack_md">
<div class="flex justify-between items-center mb-stack_sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">schedule</span>
                        上课时间
                    </h2>
<button class="text-primary flex items-center gap-1 font-label-md text-label-md hover:opacity-80">
<span class="material-symbols-outlined text-[18px]">add_circle</span> 添加
                    </button>
</div>
<div class="space-y-3 mt-stack_sm">
<!-- Time Slot 1 -->
<div class="flex items-center gap-3 bg-surface-container-low p-3 rounded-lg border border-outline-variant">
<div class="flex-1 flex justify-between items-center bg-surface-container-lowest rounded px-3 py-2 border border-outline-variant">
<span class="font-body-md text-body-md text-on-surface">14:00</span>
<span class="text-outline-variant">-</span>
<span class="font-body-md text-body-md text-on-surface">15:30</span>
</div>
<button aria-label="删除时间段" class="text-error hover:opacity-80 p-1">
<span class="material-symbols-outlined text-[20px]">do_not_disturb_on</span>
</button>
</div>
</div>
</section>
<!-- Step 4: End Condition -->
<section class="bg-surface-container-lowest rounded-lg border border-outline-variant p-stack_md">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack_sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">event_busy</span>
                    结束条件
                </h2>
<div class="flex gap-4 mt-stack_sm border-b border-outline-variant pb-2 mb-3">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="text-primary focus:ring-primary h-4 w-4 border-outline" name="end_condition" type="radio"/>
<span class="font-body-md text-body-md text-on-surface">按排课次数</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="text-primary focus:ring-primary h-4 w-4 border-outline" name="end_condition" type="radio"/>
<span class="font-body-md text-body-md text-on-surface-variant">按结束日期</span>
</label>
</div>
<div class="flex items-center justify-between bg-surface-container-low p-3 rounded-lg border border-outline-variant">
<span class="font-body-md text-body-md text-on-surface-variant">共排课</span>
<div class="flex items-center gap-2">
<input class="w-16 text-center rounded border-outline-variant bg-surface-container-lowest py-1 font-body-md text-body-md focus:ring-primary focus:border-primary text-on-surface" type="number" value="20"/>
<span class="font-body-md text-body-md text-on-surface-variant">次</span>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 w-full max-w-[375px] z-50 bg-surface-container-lowest border-t border-outline-variant p-page_margin pb-6">
<button class="w-full h-[46px] bg-primary-container text-on-primary rounded-lg font-headline-sm text-headline-sm flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-sm">
<span class="material-symbols-outlined text-[20px]">visibility</span>
                预览排课结果
            </button>
</div>
</div>
</body></html>
