<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed max-w-md mx-auto relative shadow-2xl">
<!-- TopAppBar (Transactional State) -->
<header class="w-full sticky top-0 z-50 bg-surface border-b border-outline-variant flex items-center justify-between px-page_margin h-14">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">采购入库</h1>
<!-- Spacer to ensure exact centering of the title -->
<div class="w-10 h-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-page_margin py-stack_md pb-32 flex flex-col gap-gutter">
<!-- Card 1: Item Identification -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 shadow-sm">
<h2 class="font-label-md text-label-md text-primary uppercase tracking-widest mb-stack_md flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">inventory_2</span>
                Item Details
            </h2>
<div class="mb-stack_md">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">Select Item <span class="text-error">*</span></label>
<div class="relative group">
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-3 pr-10 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow placeholder:text-outline" placeholder="Search item name, code, or SKU..." type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors pointer-events-none">search</span>
</div>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">Specification</label>
<input class="w-full h-[44px] bg-surface border border-outline-variant border-dashed rounded-DEFAULT px-3 font-body-md text-body-md text-on-surface-variant/70 cursor-not-allowed select-none" readonly="" type="text" value="Select an item to view specs"/>
</div>
</section>
<!-- Card 2: Transaction Details -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 shadow-sm">
<h2 class="font-label-md text-label-md text-primary uppercase tracking-widest mb-stack_md flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">receipt_long</span>
                Purchase Data
            </h2>
<div class="mb-stack_md">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">Purchase Date <span class="text-error">*</span></label>
<div class="relative group">
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-3 pr-10 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow" type="date"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors pointer-events-none">calendar_month</span>
</div>
</div>
<div class="grid grid-cols-2 gap-3 mb-stack_md">
<div>
<label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">Unit Price <span class="text-error">*</span></label>
<div class="relative focus-within:text-primary-container text-on-surface-variant">
<span class="absolute left-3 top-1/2 -translate-y-1/2 font-body-md text-body-md transition-colors">¥</span>
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-8 pr-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow" id="unitPrice" min="0" placeholder="0.00" step="0.01" type="number"/>
</div>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">Quantity <span class="text-error">*</span></label>
<div class="relative focus-within:text-primary-container text-on-surface-variant">
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow" id="quantity" min="1" placeholder="0" type="number"/>
</div>
</div>
</div>
<div class="p-3 bg-surface rounded-DEFAULT border border-outline-variant mb-stack_md">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1">Total Amount</label>
<div class="flex items-baseline gap-1">
<span class="font-body-md text-body-md text-primary font-medium">¥</span>
<span class="font-headline-md text-headline-md text-primary font-bold tracking-tight" id="totalAmount">0.00</span>
</div>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">Payment Method</label>
<div class="relative group">
<select class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-3 pr-10 appearance-none font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow">
<option disabled="" selected="" value="">Select method</option>
<option value="bank">Bank Transfer</option>
<option value="alipay">AliPay Corporate</option>
<option value="cash">Petty Cash</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none group-focus-within:text-primary-container transition-colors">expand_more</span>
</div>
</div>
</section>
<!-- Card 3: Meta Information -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 shadow-sm">
<h2 class="font-label-md text-label-md text-primary uppercase tracking-widest mb-stack_md flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">admin_panel_settings</span>
                Administration
            </h2>
<div class="mb-stack_md">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">Handler</label>
<div class="relative group">
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-10 pr-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow" placeholder="Name of person handling" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none group-focus-within:text-primary-container transition-colors">person</span>
</div>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">Remarks</label>
<textarea class="w-full min-h-[88px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow resize-y" placeholder="Add any additional notes here..."></textarea>
</div>
</section>

<!-- Bottom Action Area (Fixed) -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-page_margin bg-surface-container-lowest border-t border-outline-variant pb-safe shadow-[0_-8px_16px_-4px_rgba(0,0,0,0.05)] z-40">
<button class="w-full h-[46px] bg-primary-container text-on-primary rounded-lg font-headline-sm text-headline-sm flex items-center justify-center gap-2 hover:bg-tertiary-container active:scale-[0.98] transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            确认入库
        </button>
</div>
<script>
        // Simple logic to calculate total visually
        const unitPriceInput = document.getElementById('unitPrice');
        const quantityInput = document.getElementById('quantity');
        const totalAmountDisplay = document.getElementById('totalAmount');

        function calculateTotal() {
            const price = parseFloat(unitPriceInput.value) || 0;
            const qty = parseInt(quantityInput.value) || 0;
            const total = price * qty;
            
            // Add a brief fade effect for feedback
            totalAmountDisplay.style.opacity = '0.5';
            setTimeout(() => {
                totalAmountDisplay.textContent = total.toFixed(2);
                totalAmountDisplay.style.opacity = '1';
                totalAmountDisplay.style.transition = 'opacity 0.2s ease-in-out';
            }, 100);
        }

        unitPriceInput.addEventListener('input', calculateTotal);
        quantityInput.addEventListener('input', calculateTotal);
    </script>
