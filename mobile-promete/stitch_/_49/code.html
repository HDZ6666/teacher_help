<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>发放会员卡 - 老师帮</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#a7cfc2",
                        "on-primary-fixed": "#002117",
                        "primary-fixed-dim": "#88d6b9",
                        "tertiary-fixed": "#8cf7c7",
                        "surface-tint": "#166b53",
                        "on-background": "#0f1d23",
                        "on-secondary-fixed-variant": "#284d44",
                        "error": "#ba1a1a",
                        "primary-fixed": "#a4f2d4",
                        "surface-container-highest": "#d6e5ed",
                        "on-primary-fixed-variant": "#00513d",
                        "surface-container-low": "#e7f6fe",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#466c61",
                        "on-primary-container": "#a4f2d4",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#6fdaac",
                        "on-surface-variant": "#3f4944",
                        "inverse-primary": "#88d6b9",
                        "primary": "#005842",
                        "tertiary": "#00583d",
                        "on-tertiary-container": "#8cf7c7",
                        "surface-dim": "#cddce4",
                        "outline-variant": "#bec9c3",
                        "on-tertiary-fixed-variant": "#005138",
                        "surface-container-high": "#dbebf3",
                        "surface": "#f3faff",
                        "primary-container": "#1f7159",
                        "inverse-surface": "#243239",
                        "inverse-on-surface": "#e4f3fb",
                        "tertiary-container": "#007351",
                        "on-tertiary-fixed": "#002114",
                        "secondary-container": "#c2ebde",
                        "surface-variant": "#d6e5ed",
                        "on-secondary": "#ffffff",
                        "outline": "#6f7974",
                        "background": "#f3faff",
                        "secondary": "#40655b",
                        "surface-bright": "#f3faff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#00201a",
                        "secondary-fixed": "#c2ebde",
                        "on-surface": "#0f1d23",
                        "surface-container": "#e1f0f8",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack_md": "16px",
                        "stack_sm": "8px",
                        "stack_lg": "24px",
                        "page_margin": "14px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "body-sm": ["Be Vietnam Pro"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-lg": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

                        "display": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }
            }
        }
    </script>
<style>
        body { background-color: #f4f6f5; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-surface w-full max-w-[375px] mx-auto min-h-screen relative flex flex-col">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-page_margin w-full h-14 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline docked full-width top-0 sticky z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-transform active:scale-95 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed flex-1 text-center font-bold">发放会员卡</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-page_margin py-stack_md flex flex-col gap-gutter pb-24">
<!-- Form Container -->
<form class="bg-surface-container-lowest rounded-lg border border-[#e7ece9] p-page_margin flex flex-col gap-stack_md">
<!-- 选择学员 -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">选择学员</label>
<div class="relative">
<select class="w-full h-11 bg-transparent border border-[#e7ece9] rounded-lg px-3 appearance-none font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
<option disabled="" selected="" value="">请选择学员</option>
<option value="1">张三 (Zhang San)</option>
<option value="2">李四 (Li Si)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- 选择会员卡 -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">选择会员卡</label>
<div class="relative">
<select class="w-full h-11 bg-transparent border border-[#e7ece9] rounded-lg px-3 appearance-none font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
<option disabled="" selected="" value="">请选择会员卡类型</option>
<option value="annual">年度畅学卡</option>
<option value="semester">秋季强化班卡</option>
<option value="10classes">10课时次卡</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- 实收金额 -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">实收金额</label>
<div class="relative flex items-center">
<span class="absolute left-3 font-body-md text-body-md text-on-surface-variant">¥</span>
<input class="w-full h-11 bg-transparent border border-[#e7ece9] rounded-lg pl-8 pr-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="0.00" type="number"/>
</div>
</div>
<div class="h-px bg-[#e7ece9] w-full my-1"></div> <!-- Divider -->
<!-- 支付方式 -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">支付方式</label>
<div class="grid grid-cols-2 gap-2">
<label class="flex items-center gap-2 p-3 border border-[#e7ece9] rounded-lg cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-secondary-container transition-colors">
<input checked="" class="hidden" name="payment" type="radio" value="wechat"/>
<span class="material-symbols-outlined text-[#1AAD19]" data-icon="chat" data-weight="fill">chat</span> <!-- Approximate Wechat icon -->
<span class="font-body-sm text-body-sm text-on-surface">微信</span>
</label>
<label class="flex items-center gap-2 p-3 border border-[#e7ece9] rounded-lg cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-secondary-container transition-colors">
<input class="hidden" name="payment" type="radio" value="alipay"/>
<span class="material-symbols-outlined text-[#1677FF]" data-icon="payments" data-weight="fill">payments</span> <!-- Approximate Alipay icon -->
<span class="font-body-sm text-body-sm text-on-surface">支付宝</span>
</label>
<label class="flex items-center gap-2 p-3 border border-[#e7ece9] rounded-lg cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-secondary-container transition-colors">
<input class="hidden" name="payment" type="radio" value="cash"/>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="money">money</span>
<span class="font-body-sm text-body-sm text-on-surface">现金</span>
</label>
<label class="flex items-center gap-2 p-3 border border-[#e7ece9] rounded-lg cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-secondary-container transition-colors">
<input class="hidden" name="payment" type="radio" value="balance"/>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-body-sm text-body-sm text-on-surface">余额</span>
</label>
</div>
</div>
<!-- 生效日期 -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">生效日期</label>
<div class="relative">
<input class="w-full h-11 bg-transparent border border-[#e7ece9] rounded-lg px-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none" type="date"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- 备注 -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant">备注</label>
<textarea class="w-full bg-transparent border border-[#e7ece9] rounded-lg p-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary resize-none" placeholder="添加备注信息..." rows="3"></textarea>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full max-w-[375px] bg-surface-container-lowest border-t border-outline-variant p-page_margin z-50">
<button class="w-full h-[46px] bg-primary-container text-on-tertiary rounded-lg font-headline-sm text-headline-sm flex items-center justify-center hover:bg-surface-tint transition-colors active:scale-[0.98]">
            确认发放
        </button>
</div>
</body></html>
